# myinfobase 生产 Compose 模板（实际部署目录：deploy/production/）
# 单实例常驻；数据在项目 runtime 目录，与版本无关；源目录只读。
# 改动本文件后必须同步 deploy/production/compose.yaml —— 部署用的是后者。
services:
  myinfobase:
    image: myinfobase:${MYINFOBASE_TAG:-0.15.0}
    container_name: myinfobase
    restart: unless-stopped
    # 以共享目录属主身份运行，避免 root 写数据；uid/gid 按 NAS 实际账号在 .env 配置
    user: "${CONTAINER_UID:-1026}:${CONTAINER_GID:-100}"
    ports:
      - "${MYINFOBASE_PORT:-4317}:4317"
    environment:
      NODE_ENV: production
      # 容器内约定路径
      SOURCE_ROOT: /source
      DATA_DIR: /app/data
      BACKUP_DIR: /app/backups
      LOG_DIR: /app/data/logs
      HOST: 0.0.0.0
      PORT: 4317
      TZ: Asia/Shanghai
      PUBLIC_ORIGIN: "http://${NAS_IP:-192.168.31.246}:${MYINFOBASE_PORT:-4317}"
      EXTRA_ALLOWED_ORIGINS: "http://localhost:${MYINFOBASE_PORT:-4317},http://${NAS_IP:-192.168.31.246}:${MYINFOBASE_PORT:-4317}"
      # AI 分类兜底（规则未命中时用；密钥写在本 .env，不进 git）。留空 = 关闭 AI 兜底
      AI_CLASSIFY_API_KEY: "${AI_CLASSIFY_API_KEY:-}"
      AI_CLASSIFY_BASE_URL: "${AI_CLASSIFY_BASE_URL:-https://api.xiaomimimo.com/v1}"
      AI_CLASSIFY_MODEL: "${AI_CLASSIFY_MODEL:-mimo-v2.6-flash}"
      AI_CLASSIFY_MAX_PER_REFRESH: "${AI_CLASSIFY_MAX_PER_REFRESH:-40}"
      AI_CLASSIFY_TIMEOUT_MS: "${AI_CLASSIFY_TIMEOUT_MS:-30000}"
      # 图片 OCR 与语音转录（ASR）：留空/不设走代码默认值；空串会被代码当"没配"回退
      AI_VISION_MODEL: "${AI_VISION_MODEL:-}"
      AI_OCR_TIMEOUT_MS: "${AI_OCR_TIMEOUT_MS:-120000}"
      AI_OCR_MAX_PER_NOTE: "${AI_OCR_MAX_PER_NOTE:-8}"
      AI_ASR_MODEL: "${AI_ASR_MODEL:-mimo-v2.5-asr}"
      AI_ASR_TIMEOUT_MS: "${AI_ASR_TIMEOUT_MS:-300000}"
      AI_ASR_MAX_PER_NOTE: "${AI_ASR_MAX_PER_NOTE:-4}"
      # 语料导出：必须指到挂载卷内——/app 根归 root，非 root 用户建不了 /app/export（默认值在容器里必然 EACCES）。
      # environment 是白名单：EXPORT_* 不列出来的话，.env 里写了也进不了容器（深审发现）。
      EXPORT_DIR: /app/data/export
      EXPORT_AFTER_REFRESH: "${EXPORT_AFTER_REFRESH:-true}"
    volumes:
      # Obsidian vault 根（含 RedNote / 我的收藏品 / flomo）：只读挂载（NAS 本机真实路径，写在 .env）
      - ${SOURCE_ROOT}:/source:ro
      # 生产数据与备份：固定在项目 runtime 目录，不随版本切换
      - ../../runtime/data:/app/data
      - ../../runtime/backups:/app/backups
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4317/api/health >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 8s
      start_period: 120s
      retries: 3
