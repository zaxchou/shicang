<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8FA3"/>
      <stop offset="0.52" stop-color="#F43F6B"/>
      <stop offset="1" stop-color="#C81E5B"/>
    </linearGradient>
    <filter id="blur40" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="52"/>
    </filter>
    <linearGradient id="plate" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.52"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="glyphShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#8E0F3F" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 底：渐变圆角方块 -->
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <!-- 深度色团（高斯模糊） -->
  <g filter="url(#blur40)">
    <circle cx="300" cy="236" r="236" fill="#FFD7E0" opacity="0.62"/>
    <circle cx="792" cy="742" r="264" fill="#8E1347" opacity="0.40"/>
    <circle cx="776" cy="226" r="172" fill="#FFEAF0" opacity="0.52"/>
    <circle cx="244" cy="806" r="224" fill="#FF6E8D" opacity="0.55"/>
  </g>

  <!-- 玻璃衬板：顶部高光 + 边缘亮环 -->
  <rect x="150" y="150" width="724" height="724" rx="172" fill="url(#plate)"/>
  <rect x="151.5" y="151.5" width="721" height="721" rx="170" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <!-- 衬板顶部弧光 -->
  <path d="M 260 208 Q 512 158 764 208" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="14" stroke-linecap="round"/>
  <!-- 底部折光条 -->
  <path d="M 300 828 Q 512 872 724 828" fill="none" stroke="#ffffff" stroke-opacity="0.30" stroke-width="10" stroke-linecap="round"/>

  <!-- 字形：投影 + 白字 -->
  <text x="512" y="560" text-anchor="middle" dominant-baseline="central" font-family="'PingFang SC','Microsoft YaHei','Heiti SC',sans-serif" font-weight="700" font-size="560" fill="#ffffff" filter="url(#glyphShadow)">拾</text>
</svg>
